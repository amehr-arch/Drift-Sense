[project]
name = "drift-sense"
version = "0.1.0"
description = "Synthetic SEM dataset generation and navigation-error recovery for wafer inspection"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "Pillow>=9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
